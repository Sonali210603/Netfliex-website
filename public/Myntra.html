
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Myntra</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"&gt;

    <link rel="preconnect" href="https://fonts.gstatic.com&quot; crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Bitcount+Grid+Double:wght@100..900&family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@200..700&family=Pacifico&family=Playwrite+BE+WAL+Guides&family=Playwrite+BR+Guides&family=Playwrite+CU+Guides&family=Playwrite+NZ+Guides&family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Rubik+Maze&family=Russo+One&display=swap&quot; rel="stylesheet">

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <style>

        header {

            padding: 20px;

            background-color: #ededed;

            font-family: arial;

            font-size: 18px;

            display: flex;

            flex-direction: row;

            justify-content: space-between;

            align-items: center;

            box-shadow: 2px 2px 2px gray;

        }

        .brand-logo {

            font-size: 50px;

            font-weight: bold;

            color:red;

            font-family: RUSSO ONE;

        }

        nav span {

            margin-right: 20px;

            font-size: 18px;

            font-weight: bold;

        }

        .search-bar {

            background-color: #cccbcb;

            padding: 10px;

            width: 350px;

            border-radius: 5px;

        }

        .search-text {

            font-size: 16px;

            padding-left: 20px;

        }

        .shortcut-item span {

            display: block;

        }

        .shortcut-item-text {

            font-size: 14px;

            font-weight: bold;

        }

        .bi-person, .bi-heart, .bi-bag {

            font-size: 22px;

        }

        .shortcuts {

            display: flex;

            flex-direction: row;

            justify-content: space-between;

            width: 150px;

            text-align: center;

        }

    </style>

</head>

<body>

    <header>

        <div>

           <nav>

              <span class="brand-logo">M</span>

              <span>MEN</span>

              <span>WOMEN</span>

              <span>KDIS</span>

              <span>HOME</span>

              <span>BEAUTY</span>

              <span>GENZ</span>

              <span>STUDIO</span>

           </nav> 

        </div>

        <div>

            <div class="search-bar">

                <span class="bi bi-search"></span>

                <span class="search-text">Search for products, brands and more</span>

            </div>

        </div>

        <div>

            <div class="shortcuts">

                <div class="shortcut-item">

                    <span class="bi bi-person"></span>

                    <span class="shortcut-item-text">Profile</span>

                </div>

                <div class="shortcut-item">

                    <span class="bi bi-heart"></span>

                    <span class="shortcut-item-text">Wishlist</span>

                </div>

                <div class="shortcut-item">

                    <span class="bi bi-bag"></span>

                    <span class="shortcut-item-text">Bag</span>

                </div>

            </div>

        </div>

    </header>

</body>

</html>
